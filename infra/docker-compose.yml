# =============================================================================
# AutoAtende — Stack Completa
# Ordem de dependência: postgres + redis → evolution + typebot + n8n + chatwoot
# Tudo passa pelo Nginx Proxy Manager — nenhuma porta interna exposta
# =============================================================================

networks:
  autoatende:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  n8n_data:
  typebot_data:
  chatwoot_data:
  evolution_data:
  npm_data:
  npm_letsencrypt:

services:

  # ─────────────────────────────────────────────────────────────────────────
  # INFRAESTRUTURA BASE
  # ─────────────────────────────────────────────────────────────────────────

  postgres:
    image: postgres:15-alpine
    container_name: autoatende-postgres
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
    networks:
      - autoatende
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  redis:
    image: redis:7-alpine
    container_name: autoatende-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - autoatende
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  nginx-proxy-manager:
    image: jc21/nginx-proxy-manager:latest
    container_name: autoatende-npm
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "81:81"   # ← FECHAR NO UFW após configurar: ufw delete allow 81/tcp
    volumes:
      - npm_data:/data
      - npm_letsencrypt:/etc/letsencrypt
    networks:
      - autoatende

  # ─────────────────────────────────────────────────────────────────────────
  # EVOLUTION API — Bridge WhatsApp ↔ automação
  # ─────────────────────────────────────────────────────────────────────────

  evolution-api:
    image: atendai/evolution-api:latest
    container_name: autoatende-evolution
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - evolution_data:/evolution/instances
    environment:
      SERVER_URL: https://api.${DOMAIN}
      AUTHENTICATION_TYPE: apikey
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY}
      DATABASE_ENABLED: "true"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB_EVOLUTION}
      DATABASE_CONNECTION_CLIENT_NAME: evolution_api
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: redis://:${REDIS_PASSWORD}@redis:6379/1
      CACHE_REDIS_PREFIX_KEY: evolution
      WEBHOOK_GLOBAL_URL: https://n8n.${DOMAIN}/webhook/evolution
      WEBHOOK_GLOBAL_ENABLED: "true"
      WEBHOOK_EVENTS_MESSAGES_UPSERT: "true"
      WEBHOOK_EVENTS_CONNECTION_UPDATE: "true"
      LOG_LEVEL: ERROR
    networks:
      - autoatende
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ─────────────────────────────────────────────────────────────────────────
  # TYPEBOT — Editor e Viewer de fluxos conversacionais
  # ─────────────────────────────────────────────────────────────────────────

  typebot-builder:
    image: baptistearno/typebot-builder:latest
    container_name: autoatende-typebot-builder
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - typebot_data:/app/packages/bot-engine/.next/cache
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB_TYPEBOT}
      NEXTAUTH_URL: https://flows.${DOMAIN}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      ENCRYPTION_SECRET: ${TYPEBOT_ENCRYPTION_SECRET}
      NEXT_PUBLIC_VIEWER_URL: https://bot.${DOMAIN}
      ADMIN_EMAIL: ${SMTP_USER}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USERNAME: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_SECURE: "false"
      SMTP_AUTH_DISABLED: "false"
      DISABLE_SIGNUP: "false"
    networks:
      - autoatende

  typebot-viewer:
    image: baptistearno/typebot-viewer:latest
    container_name: autoatende-typebot-viewer
    restart: unless-stopped
    depends_on:
      - typebot-builder
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB_TYPEBOT}
      NEXTAUTH_URL: https://flows.${DOMAIN}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      ENCRYPTION_SECRET: ${TYPEBOT_ENCRYPTION_SECRET}
      NEXT_PUBLIC_VIEWER_URL: https://bot.${DOMAIN}
    networks:
      - autoatende

  # ─────────────────────────────────────────────────────────────────────────
  # N8N — Orquestrador de automações
  # ─────────────────────────────────────────────────────────────────────────

  n8n:
    image: n8nio/n8n:latest
    container_name: autoatende-n8n
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - n8n_data:/home/node/.n8n
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: ${POSTGRES_DB_N8N}
      DB_POSTGRESDB_USER: postgres
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
      N8N_BASIC_AUTH_ACTIVE: "true"
      N8N_BASIC_AUTH_USER: ${N8N_BASIC_AUTH_USER}
      N8N_BASIC_AUTH_PASSWORD: ${N8N_BASIC_AUTH_PASSWORD}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      WEBHOOK_URL: https://n8n.${DOMAIN}
      N8N_HOST: n8n.${DOMAIN}
      N8N_PROTOCOL: https
      N8N_PORT: 5678
      EXECUTIONS_DATA_SAVE_ON_SUCCESS: none
      EXECUTIONS_DATA_SAVE_ON_ERROR: all
      EXECUTIONS_DATA_SAVE_MANUAL_EXECUTIONS: "true"
      GENERIC_TIMEZONE: America/Sao_Paulo
      N8N_LOG_LEVEL: warn
    networks:
      - autoatende
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:5678/healthz || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ─────────────────────────────────────────────────────────────────────────
  # CHATWOOT — Painel de atendimento humano
  # ─────────────────────────────────────────────────────────────────────────

  chatwoot-app:
    image: chatwoot/chatwoot:latest
    container_name: autoatende-chatwoot
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - chatwoot_data:/app/storage
    command: bundle exec rails s -p 3000 -b 0.0.0.0
    environment:
      SECRET_KEY_BASE: ${CHATWOOT_SECRET_KEY_BASE}
      FRONTEND_URL: https://atende.${DOMAIN}
      DEFAULT_LOCALE: pt_BR
      RAILS_ENV: production
      INSTALLATION_ENV: docker
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB_CHATWOOT}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/2
      MAILER_SENDER_EMAIL: ${SMTP_USER}
      SMTP_ADDRESS: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USERNAME: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_DOMAIN: ${DOMAIN}
      SMTP_ENABLE_STARTTLS_AUTO: "true"
      ACTIVE_STORAGE_SERVICE: local
    networks:
      - autoatende

  chatwoot-worker:
    image: chatwoot/chatwoot:latest
    container_name: autoatende-chatwoot-worker
    restart: unless-stopped
    depends_on:
      - chatwoot-app
    volumes:
      - chatwoot_data:/app/storage
    command: bundle exec sidekiq -C config/sidekiq.yml
    environment:
      SECRET_KEY_BASE: ${CHATWOOT_SECRET_KEY_BASE}
      FRONTEND_URL: https://atende.${DOMAIN}
      RAILS_ENV: production
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB_CHATWOOT}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/2
      MAILER_SENDER_EMAIL: ${SMTP_USER}
      SMTP_ADDRESS: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USERNAME: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
    networks:
      - autoatende
